##########################################################################################################
# phases
#--------------------------------------------------------------------------------------------------------#
# Phase timing. Each phase has its own section phase_1, phase_2, ...
##########################################################################################################

phases {
    # Length of a phase whose own 'days' is 0.
    D:baseDays=3.0

    # Number of phases. Sections for new phases are created with empty effects. [range: 1 ~ 1000, default: 5]
    I:count=6

    # CARRY: the convert and destroy rules of every phase so far apply; for a block several phases convert, the latest
    # phase's rule wins. Terrain loaded late then looks like terrain that lived through every phase.
    # ISOLATED: only the running phase's rules apply.
    # Either way a chain of rules (grass -> dirt, dirt -> sand) is followed to its end. [default: CARRY]
    S:ruleMode=CARRY

    # Phase 0: days before the apocalypse starts.
    D:safeDays=3.0

    # Length of phase n (when its own 'days' is 0): CONSTANT baseDays, LINEAR baseDays*n, QUADRATIC baseDays*n*n,
    # EXPONENTIAL baseDays*scalingFactor^(n-1). [default: CONSTANT]
    S:scaling=CONSTANT

    # EXPONENTIAL scaling factor.
    D:scalingFactor=1.5
}


##########################################################################################################
# splash
#--------------------------------------------------------------------------------------------------------#
# The splash title of a phase (phase_n.splash) on every player's screen. Text in a phase's message
# and splash can use & formatting codes (&c red, &l bold...).
##########################################################################################################

splash {
    # Ticks the splash takes to appear. [range: 1 ~ 1200, default: 10]
    I:fadeInTicks=10

    # Ticks it takes to disappear. [range: 1 ~ 1200, default: 30]
    I:fadeOutTicks=30

    # The title flickers between titleColor and this (same value: no flicker). [default: FFC21F]
    S:flickerColor=FFC21F

    # Colour of the phase's message under the title. [default: FFE0A0]
    S:messageColor=FFE0A0

    # Client: font texture of the message; empty = Minecraft's own. [default: ]
    S:messageFont=

    # Ticks it stays. [range: 0 ~ 12000, default: 80]
    I:stayTicks=80

    # Title colour (hex RGB). [default: FF6A00]
    S:titleColor=FF6A00

    # Client: font texture of the title (a 16 x 16 character grid like minecraft:textures/font/ascii.png). Minecraft's
    # own font while the texture is missing or this is empty. [default: solarapocalypse:textures/font/splash.png]
    S:titleFont=solarapocalypse:textures/font/splash.png
}


##########################################################################################################
# world
#--------------------------------------------------------------------------------------------------------#
# Where the apocalypse runs and how the sun's reach is measured.
##########################################################################################################

world {
    # What phase depths count down from (layer 1 is the reference itself, layer 2 the block below, ...):
    # SURFACE: each column's own terrain surface, so every column loses the same thickness at any altitude. Taken
    # from the generator in CubicWorldGen worlds, otherwise recorded when the column is first seen (ignoring trees).
    # TOP_Y: the fixed Y topY for every column (mountains go first, valleys when the depth gets down to them).
    # Blocks above the reference count as reached from phase 1 on. [default: SURFACE]
    S:depthReference=SURFACE

    # Dimension ids the apocalypse affects.
    I:dimensions <
        0
     >

    # Cubic Chunks: no terrain exists above this Y; positions above it are exposed unless something loaded covers them.
    # 'none' disables it. [default: none]
    S:skyCeilingY=none

    # Cubic Chunks: a position only counts as sun-exposed when the cubes up to this many blocks above it are loaded
    # (or above skyCeilingY, or above the CubicWorldGen surface + surfaceMargin). Never-generated cubes count as air in
    # Cubic Chunks, so without this, caves deep underground near the top of the loaded area would count as open sky. [range: 0 ~ 1048576, default: 32]
    I:skyClearance=32

    # Positions below this Y are always shaded (for mobs and for exposure-based block effects). 'none' disables it. [default: none]
    S:sunFloorY=none

    # CubicWorldGen worlds: blocks above the generator's terrain surface that trees and structures can reach. Above
    # surface + margin nothing generated can cover the sun. [range: 0 ~ 1048576, default: 48]
    I:surfaceMargin=48

    # TOP_Y reference. 'auto': in Cubic Chunks worlds the height the world's generator reports (CubicWorldGen: the
    # preset's estimated terrain height), otherwise the world height. [default: auto]
    S:topY=auto
}


