# Configuration file

##########################################################################################################
# blocks
#--------------------------------------------------------------------------------------------------------#
# How block changes are applied.
##########################################################################################################

blocks {
    # Changes notify neighbours: sand and gravel fall, liquids flow into removed space. In Cubic Chunks this can
    # generate neighbouring cubes at cube edges. [default: false]
    B:blockPhysics=false

    # Destroyed blocks drop their items, and so do blocks that pop off a changed block (plants, crops, torches...).
    # Container contents never drop when false. [default: false]
    B:dropItems=false

    # true: night puts the sun's fire out. Each solar fire goes out at its own moment over the sunset (time of day
    # 12000-14000) and the same spots light again over the sunrise (23000-1000); no new fire is lit at night (vanilla
    # fire already burning is left to vanilla). false: fire, once lit, stays (infinite phases redraw it on every layer). [default: false]
    B:nightDousesFire=false

    # Flammable blocks that never get vanilla fire from the sun (selectors, as in the phases' destroy lists); they are
    # treated like other blocks (solar fire, which never lights anything). With the gamerule doFireTick false no block
    # gets vanilla fire. [default: [minecraft:tnt]]
    S:vanillaFireBlacklist <
        minecraft:tnt
     >
}


##########################################################################################################
# clock
#--------------------------------------------------------------------------------------------------------#
# How apocalypse time advances. 1 day = 24000 progress units.
##########################################################################################################

clock {
    # SUN: count the overworld's sun clock (worldTime) moving forward, so a day lasts as long as the sun takes, with any
    # day-length mod. Skipped time counts: sleeping, /time add, and /time set (as the skip forward to that time of day;
    # setting the time of day back by less than 100 counts nothing). Stops while doDaylightCycle is false.
    # TICKS: count server ticks; one day = ticksPerDay ticks. [default: SUN]
    S:mode=SUN

    # true: time runs while no player is online and the changes are caught up when terrain loads.
    # false: the apocalypse pauses while the server is empty. [default: false]
    B:progressWhileEmpty=false

    # TICKS mode: server ticks per apocalypse day. [range: 1 ~ 2147483647, default: 24000]
    I:ticksPerDay=24000
}


##########################################################################################################
# entities
#--------------------------------------------------------------------------------------------------------#
# Sun damage. Amounts per phase are in the phase sections.
##########################################################################################################

entities {
    # Players take damage (never in creative or spectator). [default: true]
    B:affectPlayers=true

    # Background heat reaches mobs wherever the sky light is at least this (under trees and overhangs, in houses with
    # openings), day and night. Sealed rooms and caves without sky light are safe. [range: 0 ~ 15, default: 4]
    I:backgroundMinSkyLight=4

    # Entity ids that never take sun damage, e.g. minecraft:villager_golem. [default: ]
    S:blacklist <
     >

    # What Fire Resistance protects from: NONE, DIRECT (sun), BACKGROUND (heat), BOTH. [default: DIRECT]
    S:fireResistance=DIRECT

    # Damage is dealt every this many ticks. [range: 1 ~ 72000, default: 20]
    I:intervalTicks=20

    # Fire-immune mobs (blazes, magma cubes...) take no damage. [default: false]
    B:spareFireImmune=false

    # With sunNeedsDaytime: from this phase on, direct sun damage happens at night too. 0 = never. [range: 0 ~ 1000, default: 7]
    I:sunAtNightFromPhase=1

    # Direct sun damage only while the world counts it as day. [default: true]
    B:sunNeedsDaytime=true
}


##########################################################################################################
# evaporation
#--------------------------------------------------------------------------------------------------------#
# How sun-exposed liquids vanish. Which liquids, from which phase: each phase's evaporate list.
##########################################################################################################

evaporation {
    # LAYERS mode: layers per day.
    D:layersPerDay=200.0

    # INSTANT: every exposed liquid block goes as soon as its phase starts (spread over ticks by the time budget).
    # LAYERS: from its phase's start, a level descends from topY at layersPerDay; exposed liquid above it goes. [default: LAYERS]
    S:mode=INSTANT

    # LAYERS mode: Y the level starts at. 'auto': the world's sea level. [default: auto]
    S:topY=auto
}


performance {
    # ...and at most this share of the time left in a 50 ms tick by everything else (average of the last 100 ticks),
    # so a busy server slows the apocalypse down instead of lagging. At least 0.5 ms per tick always runs.
    D:freeTickShare=0.5

    # ...and at most this many block changes per server tick, which caps what clients are sent and must redraw.
    # 0 = no limit. [range: 0 ~ 2147483647, default: 512]
    I:maxBlockChangesPerTick=0

    # After a /time set or /time add skip (not sleeping, which keeps the budget above), the engine catches up with the
    # bigger budget below for this many seconds: faster, with some lag. 0 = no boost. [range: 0 ~ 3600, default: 30]
    I:skipBoostSeconds=30

    # Block changes per server tick during that boost (0 = no limit). [range: 0 ~ 2147483647, default: 2048]
    I:skipMaxBlockChangesPerTick=2048

    # Milliseconds per server tick during that boost.
    D:skipTickBudgetMs=20.0

    # At most this many milliseconds per server tick are spent changing blocks.
    D:tickBudgetMs=10.0
}


phase_1 {
    # Damage per interval to mobs wherever sky light reaches (entities.backgroundMinSkyLight), sun or not.
    D:backgroundDamage=4.0

    # Seconds background heat sets mobs on fire. [range: 0 ~ 3600, default: 0]
    I:backgroundFireSeconds=0

    # Block conversions of the surface layer (see convertDepth).
    # Format: <selector> -> <block> [modifiers]. Selectors: modid:name, modid:name:meta, modid:name[property=value,...],
    # modid:*, #oreDictName, material:<name>, * (any breakable block); several separated by commas, and !<selector>
    # excludes. Target: modid:name, modid:name:meta, modid:name[property=value,...] or air. Modifiers, in any order:
    # @ <chance>%, and preserveState (keep the block's facing and other properties the target has too, unless the target
    # sets them), e.g. minecraft:anvil[damage=0] -> minecraft:anvil[damage=1] @ 25% preserveState. The top half of a tall
    # plant or door never converts by itself: it goes when its bottom half changes. dimensions=-1 (or 0,-1; * = all, as
    # without it) limits a rule to those dimensions; a rule scoped elsewhere does not hide an older one. layer=2 limits a
    # rule to layer 2 of the surface (1 = the surface block and what is on it), layer=2-4 to layers 2 to 4, depth=3 to
    # the top 3 (= layer=1-3). Without them a rule acts in the top convertDepth layers of the running phase, except that
    # in an infinite phase an earlier phase's rule acts only in layer 1, the one the erosion takes next. Blocks then step
    # through stages as the surface comes down: grass -> grass_path layer=5, grass_path -> dirt layer=4, ...
    # Rules matching a block share it out in order: dirt -> gravel @ 70% converts 70 % of dirt and leaves the rest
    # (add dirt -> sand @ 30% to cover it); a rule without @ takes all that is left. Which blocks convert is random
    # but fixed per block and rule phase: a later phase only rolls again if it has the rule too (anvils damaged a bit
    # more each phase: repeat the rule in each phase). phases.convertRuleMode decides whether earlier phases' rules
    # still apply (per block and layer, the latest phase with a rule acting there wins). [default: [minecraft:grass -> minecraft:grass_path], [minecraft:mycelium -> minecraft:grass_path], [minecraft:farmland -> minecraft:grass_path]]
    S:convert <
        material:plants -> air
        material:vine -> air
        material:cactus -> air
        material:snow -> air
        material:crafted_snow -> air
        material:ice -> air
        material:packed_ice -> air
        material:leaves -> air
        material:gourd -> air
        material:web -> air
        material:wood -> air
        material:cloth -> air
        material:carpet -> air
        material:tnt -> air
        minecraft:grass -> minecraft:grass_path layer=6
        minecraft:grass_path, minecraft:grass -> minecraft:dirt layer=5
        minecraft:grass_path, minecraft:grass, minecraft:dirt -> minecraft:gravel layer=4
        minecraft:grass_path, minecraft:grass, minecraft:dirt, minecraft:gravel -> minecraft:sand layer=3
        minecraft:grass_path, minecraft:grass, minecraft:dirt, minecraft:gravel, minecraft:sand -> solarapocalypse:vitrified_sand layer=2
     >

    # Conversions start once this phase's destruction is done and land at random but fixed moments over this many
    # days: -1 = the rest of the phase's days (at once if none are left), 0 = at once. Infinite phases: at once.
    D:convertDays=-1.0

    # Conversions reach the top this many layers of each column's current surface (1 = the top block, plus plants,
    # snow layers and the like on it), earlier phases' rules included (layers they reach for the first time convert
    # over this phase's convertDays). Converting a block to air makes the block below the new surface.
    # In an infinite phase the conversions run all the time, ahead of the descending destruction; earlier phases' rules
    # then act only in layer 1, this phase's own in all of them (or where their layer= says). [range: 1 ~ 1048576, default: 1]
    I:convertDepth=6

    # Minimum length in days (0 = phases.baseDays with phases.scaling). The phase first destroys (from its start, at
    # its speed), then converts; if that takes longer, the next phase waits until it is done.
    D:days=0.0

    # Layers below the reference (depthReference) destroyed by the end of this phase (whole number), or 'infinite'.
    # Never lower than an earlier phase's with the same reference; once infinite, every later phase is infinite. [default: 0]
    S:depth=infinite

    # What this phase's depth counts from: SURFACE or TOP_Y (see world.depthReference); INHERIT = the previous
    # phase's (phase 1: world.depthReference). Each reference has its own depth line, which only its phases move;
    # a block goes when either line reaches it. A TOP_Y line starts at world.topY and descends at this phase's speed,
    # flattening mountains first. [default: INHERIT]
    S:depthReference=SURFACE

    # Selectors of blocks removed down to the phase's depth (erosion). * = every breakable block; !<selector>
    # excludes (* and !minecraft:obsidian on two lines). dimensions=... limits an entry to those dimensions, as in convert. [default: ]
    S:destroy <
        *
     >

    # Liquids that evaporate from this phase on wherever the sun reaches them (see the evaporation section); a liquid
    # goes from the first phase that lists it. Selectors as in convert (* = every liquid), plus fluid:<name> (Forge
    # fluid name, e.g. fluid:water) and temperature<K, <=, >, >= (Forge fluid temperature in kelvin: water 300, lava
    # 1300). Example: material:water and !temperature<250 here, temperature<250 in a later phase for cold liquids.
    # dimensions=... limits an entry to those dimensions, as in convert. [default: ]
    S:evaporate <
        *
     >

    # Percent of flammable surface blocks (wood, leaves, wool...) set alight with vanilla fire instead, which spreads
    # and burns them as usual.
    D:igniteFlammablePercent=0.0

    # Percent of surface blocks alight with solar fire once the phase's conversions are done (chosen at random but
    # fixed): looks, sounds and burns like fire but never spreads. A total: 25 then 50 in the next phase keeps the first
    # 25 % alight and lights as many again. Fire is never put out between phases; in an infinite phase each new surface
    # block rolls once, so the unlit share moves with every layer. No solar fire next to (diagonals too) a block that can burn; ice and snow nearby melt as in vanilla.
    D:ignitePercent=85.0

    # RATE speed, and infinite depth: layers per day. One layer takes (day length in seconds) / layersPerDay seconds;
    # a day is 1200 s (20 minutes) with the vanilla day length, or clock.ticksPerDay / 20 s in TICKS mode. For a
    # layer every S seconds use layersPerDay = 1200 / S: 16 = a layer every 75 s, 600 = a layer every 2 s.
    D:layersPerDay=200.0

    # Chat message to every player when the phase starts; empty = none. (Defaults are placeholders for testing.) [default: Phase 1]
    S:message=Phase 1

    # Sound played to every player when the phase starts: any sound name the client knows (from a sounds.json), e.g.
    # minecraft:entity.lightning.thunder; empty = none. [default: minecraft:entity.lightning.thunder]
    S:sound=minecraft:entity.lightning.thunder

    # How destruction reaches the depth: PHASE over the phase's days, RATE at layersPerDay, INSTANT at the phase start.
    # Infinite depth always descends at layersPerDay; each layer then stays for 1/layersPerDay of a day. [default: PHASE]
    S:speed=RATE

    # Title shown big on every player's screen when the phase starts, with the message small underneath (see the
    # splash section); empty = none. [default: Phase One]
    S:splash=Phase One

    # Damage to mobs in direct sunlight per interval (2 = one heart).
    D:sunDamage=10.0

    # Seconds mobs in direct sunlight are set on fire. [range: 0 ~ 3600, default: 0]
    I:sunFireSeconds=10

    # Weather while this phase runs, in the apocalypse's dimensions: UNCHANGED (as usual), NONE (no rain), RAIN (always
    # raining), THUNDER (always a thunderstorm); INHERIT = the previous phase's (phase 1: UNCHANGED). /weather cannot
    # change it meanwhile; it lasts half a day into a following UNCHANGED phase. A thunderstorm darkens the sky so the
    # world stops counting it as day: no direct sun damage while entities.sunNeedsDaytime applies, and players can
    # sleep at any time (each sleep skips to the next morning, which the SUN clock counts). Rain puts out burning mobs
    # and vanilla fire under the open sky; solar fire stays. [default: INHERIT]
    S:weather=UNCHANGED
}


##########################################################################################################
# phases
#--------------------------------------------------------------------------------------------------------#
# Phase timing. Each phase has its own section phase_1, phase_2, ...
##########################################################################################################

phases {
    # Length of a phase whose own 'days' is 0.
    D:baseDays=2.0

    # CARRY: the convert rules of every phase so far apply; for a block several phases convert, the latest phase's
    # rules acting in its layer win. Terrain loaded late then looks like terrain that lived through every phase.
    # ISOLATED: only the running phase's rules apply.
    # Either way a chain of rules (grass -> dirt, dirt -> sand) is followed to its end. [default: CARRY]
    S:convertRuleMode=CARRY

    # Number of phases. Sections for new phases are created with empty effects. [range: 1 ~ 1000, default: 11]
    I:count=1

    # CARRY: the destroy lists of every phase so far apply. ISOLATED: only the running phase's list. [default: CARRY]
    S:destroyRuleMode=CARRY

    # Phase 0: days before the apocalypse starts.
    D:safeDays=0.25

    # Length of phase n (when its own 'days' is 0): CONSTANT baseDays, LINEAR baseDays*n, QUADRATIC baseDays*n*n,
    # EXPONENTIAL baseDays*scalingFactor^(n-1). [default: CONSTANT]
    S:scaling=CONSTANT

    # EXPONENTIAL scaling factor.
    D:scalingFactor=1.5
}


##########################################################################################################
# splash
#--------------------------------------------------------------------------------------------------------#
# The splash title of a phase (phase_n.splash) on every player's screen. Text in a phase's message
# and splash can use & formatting codes (&c red, &l bold...).
##########################################################################################################

splash {
    # Ticks the splash takes to appear. [range: 1 ~ 1200, default: 10]
    I:fadeInTicks=10

    # Ticks it takes to disappear. [range: 1 ~ 1200, default: 30]
    I:fadeOutTicks=30

    # The title flickers between titleColor and this (same value: no flicker). [default: FFC21F]
    S:flickerColor=FFC21F

    # Colour of the phase's message under the title. [default: FFE0A0]
    S:messageColor=FFE0A0

    # Client: font texture of the message; empty = Minecraft's own. [default: ]
    S:messageFont=

    # Ticks it stays. [range: 0 ~ 12000, default: 80]
    I:stayTicks=80

    # Title colour (hex RGB). [default: FF6A00]
    S:titleColor=FF6A00

    # Client: font texture of the title (a 16 x 16 character grid like minecraft:textures/font/ascii.png). Minecraft's
    # own font while the texture is missing or this is empty. [default: solarapocalypse:textures/font/splash.png]
    S:titleFont=solarapocalypse:textures/font/splash.png
}


##########################################################################################################
# world
#--------------------------------------------------------------------------------------------------------#
# Where the apocalypse runs and how the sun's reach is measured.
##########################################################################################################

world {
    # What phase depths count down from (layer 1 is the reference itself, layer 2 the block below, ...):
    # SURFACE: each column's own terrain surface, so every column loses the same thickness at any altitude. Taken
    # from the generator in CubicWorldGen worlds, otherwise recorded when the column is first seen (ignoring trees).
    # TOP_Y: the fixed Y topY for every column (mountains go first, valleys when the depth gets down to them).
    # Blocks above the reference count as reached from phase 1 on. Phases can switch with their own depthReference. [default: SURFACE]
    S:depthReference=SURFACE

    # Dimension ids the apocalypse affects.
    I:dimensions <
        0
     >

    # Cubic Chunks: no terrain exists above this Y; positions above it are exposed unless something loaded covers them.
    # 'none' disables it. [default: none]
    S:skyCeilingY=none

    # Cubic Chunks: a position only counts as sun-exposed when the cubes up to this many blocks above it are loaded
    # (or above skyCeilingY, or above the CubicWorldGen surface + surfaceMargin). Never-generated cubes count as air in
    # Cubic Chunks, so without this, caves deep underground near the top of the loaded area would count as open sky. [range: 0 ~ 1048576, default: 32]
    I:skyClearance=32

    # Positions below this Y are always shaded (for mobs and for exposure-based block effects). 'none' disables it. [default: none]
    S:sunFloorY=none

    # CubicWorldGen worlds: blocks above the generator's terrain surface that trees and structures can reach. Above
    # surface + margin nothing generated can cover the sun. [range: 0 ~ 1048576, default: 48]
    I:surfaceMargin=48

    # TOP_Y reference. 'auto': in Cubic Chunks worlds the height the world's generator reports (CubicWorldGen: the
    # preset's estimated terrain height), otherwise the world height. [default: auto]
    S:topY=auto
}


